name: Annotation Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: python:3.11.9

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GOOGLE_API_KEY: TEST
      GOOGLE_CSE_ID: TEST

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run benchmark tests
        run: |
          uv run pytest tests/automated/integration/benchmark \
            -m "manual and benchmark" \
            --benchmark-json=benchmark-results.json \
            -v

      - name: Post benchmark summary
        run: |
          uv run python - <<'EOF'
          import json, os, pathlib
          lines = []

          with open("benchmark-results.json") as f:
              data = json.load(f)
          lines += [
              "## Benchmark Results\n",
              "| Test | Mean (ms) | Min (ms) | Max (ms) | Rounds |",
              "|------|-----------|----------|----------|--------|",
          ]
          for b in data["benchmarks"]:
              s = b["stats"]
              lines.append(
                  f"| {b['name']} | {s['mean']*1000:.2f} | {s['min']*1000:.2f} | {s['max']*1000:.2f} | {s['rounds']} |"
              )

          if pathlib.Path("per-phase-results.json").exists():
              with open("per-phase-results.json") as f:
                  per_phase = json.load(f)
              lines += [
                  "\n## Per-Phase Averages\n",
                  "| Phase | " + " | ".join(per_phase.keys()) + " |",
                  "|-------|" + "|".join("---:" for _ in per_phase) + "|",
              ]
              phases = [
                  "main_query_s", "agency_suggestions_s", "location_suggestions_s",
                  "name_suggestions_s", "batch_info_s", "format_s",
              ]
              for phase in phases:
                  label = phase.replace("_s", "").replace("_", " ")
                  vals = " | ".join(
                      f"{per_phase[k].get(phase, 0)*1000:.2f} ms" for k in per_phase
                  )
                  lines.append(f"| {label} | {vals} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark-results.json
            per-phase-results.json
          retention-days: 90
